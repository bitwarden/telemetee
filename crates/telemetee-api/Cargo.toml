[package]
name = "telemetee-api"
description = "Generated client types for the Bitwarden telemetee collector."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Contents of src/ are generated by support/generate-client-bindings.sh.
# This Cargo.toml is hand-maintained; the generator skips it per .openapi-generator-ignore.

[dependencies]
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_repr = "0.1"
url = { workspace = true }

# Generated code does not carry rustdoc. Only lints that affect correctness are kept; cosmetic
# ones are muted here so a regeneration does not require editing the output.
[lints.rust]
missing_docs = "allow"

[lints.clippy]
unwrap_used = "deny"
unused_async = "warn"
